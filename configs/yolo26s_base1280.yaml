# YOLO26s protocol baseline: fold 0, step 5, 1280 px. Capped by epochs (fixed for reproducibility);
# wall_time_hours is only a safety stop. Batch 4 fits 8 GB (RTX 5060 Laptop); Ultralytics accumulates to nbs=64.
model: yolo26s.pt
epochs: 25
time: null
wall_time_hours: 3.5
imgsz: 1280
batch: 4
device: 0
workers: 2
seed: 42
deterministic: true
amp: true
rect: false
cache: false
optimizer: auto
save: true
save_period: 1
patience: 100
plots: true
verbose: false
max_det: 500
fliplr: 0.5
scale: 0.5
flipud: 0.0
degrees: 0.0
translate: 0.0
shear: 0.0
perspective: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
bgr: 0.0
mosaic: 0.0
close_mosaic: 0
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
auto_augment: null
erasing: 0.0
multi_scale: 0.0
augmentations: []
